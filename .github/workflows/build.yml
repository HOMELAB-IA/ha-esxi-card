name: CI / Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - run: npm ci

      - name: Audit (high+)
        run: npm audit --audit-level=high

      - run: npm test

      - run: npm run build

      - name: Check bundle size
        run: |
          SIZE=$(wc -c < dist/esxi-card.js)
          echo "Bundle size: ${SIZE} bytes"
          if [ "$SIZE" -gt 262144 ]; then
            echo "Bundle exceeds 256 KB"
            exit 1
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - run: npm ci && npm run build

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/esxi-card.js
          generate_release_notes: true
